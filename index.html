<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="image.png">
  <title>Catch Game</title>
  <style>
    body { margin: 0; 
    background-color: #000;
    overflow: hidden; 
    user-select: none; /* Prevent text selection */
    caret-color: transparent; /* Make the text cursor invisible */}
    canvas { display: block; background: #000; width: 100vw; height: 100vh; }
    #lives {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 24px;}
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      text-align: center;
    }
    #gameOver img {
      max-width: 100%;
      height: auto;
    }
    #restartBtn {
      position: absolute;
      top: calc(50% + 100px); /* Center under the Game Over GIF */
      left: 50%;
      transform: translate(-50%, -50%);
      background: transparent; /* Transparent background */
      color: white; /* White text */
      border: 2px solid white; /* White border */
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
      border-radius: 5px; /* Rounded corners */
      text-align: center;
      transition: all 0.3s ease; /* Smooth hover effect */
    }

    #restartBtn:hover {
      background: rgba(255, 255, 255, 0.2); /* Slightly visible background on hover */
      color: white;
    }
  </style>
</head>
<body>
  <div id="score" style="color: rgb(255, 255, 255); font-size: 20px; padding: 10px;">Score: 0</div>
  <div id="lives">
    <span class="heart">❤️</span>
    <span class="heart">❤️</span>
    <span class="heart">❤️</span>
  </div>
  <!-- <div id="gameOver" style="display:none; color: red; font-size: 2em;">Game Over</div> -->
  <div id="gameOver" style="display:none;">
    <img src="game_over.gif" alt="Game Over" />
  </div>
  <button id="restartBtn" style="display:none; margin-top: 20px; font-size: 18px;">🔄 Restart</button>

  <canvas id="gameCanvas"></canvas>

  <audio id="catchSound" src="catch.wav" preload="auto"></audio>
  <audio id="missSound" src="miss.wav" preload="auto"></audio>
  <audio id="gmaeOverSound" src="game_over.wav" preload="auto"></audio>

  <script type="module" src="main.js"></script>
</body>
</html>
